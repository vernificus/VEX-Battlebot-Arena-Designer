<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battlebot Field Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Battlebot Field Planner</h1>
        <p>Plan your VEX IQ field with the required balloon challenges.</p>
    </header>

    <main>
        <div id="sidebar">
            <h2>Elements</h2>
            <button id="clear-btn">Clear Field</button>
            <div id="palette">
                <!-- Draggable items will go here -->
            </div>
        </div>
        <div id="field-container">
            <h2>Field (6' x 8')</h2>
            <div id="grid">
                <!-- Grid cells will be generated here -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
